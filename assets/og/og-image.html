<html lang="es">

<title>OG image</title>

<style>
  :root { --film: #eef0f2; --ink: #15171a; --ink-2: #4a5059; --mark: #e6f22a; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--film); color: var(--ink); font-family: "Archivo", Arial, sans-serif; }
  .frame { position: absolute; inset: 28px; border: 2px solid var(--ink); display: grid; grid-template-rows: 1fr 76px; }
  .top { position: relative; }
  .copy { position: absolute; left: 50px; top: 108px; width: 640px; }
  .kicker { font-weight: 600; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
  h1 { margin-top: 24px; font-weight: 800; font-variation-settings: "wdth" 112; font-size: 66px; line-height: 1; letter-spacing: -.02em; }
  mark { background: var(--mark); color: var(--ink); padding: 0 4px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  svg.fig { position: absolute; right: 64px; top: 16px; height: 460px; width: auto; color: var(--ink); }
  .fig .axis { stroke: var(--ink); stroke-width: 1; stroke-dasharray: 6 4 1 4; }
  .fig .plate-top { fill: var(--film); stroke: var(--ink); stroke-width: 1.6; stroke-linejoin: round; }
  .fig .plate-side { fill: url(#hatch); stroke: var(--ink); stroke-width: 1.6; stroke-linejoin: round; }
  .fig .glyph * { fill: none; stroke: var(--ink); stroke-width: .022; }
  .fig .leader { stroke: var(--ink); stroke-width: 1.2; }
  .fig .leader-dot { fill: var(--ink); }
  .fig .balloon circle { fill: var(--film); stroke: var(--ink); stroke-width: 1.4; }
  .fig .balloon text { font-family: "Martian Mono", monospace; font-size: 13px; text-anchor: middle; dominant-baseline: central; fill: var(--ink); }
  .bar { border-top: 2px solid var(--ink); display: grid; grid-template-columns: 282px repeat(4, 1fr); }
  .bar div { padding: 14px 18px 0; border-left: 2px solid var(--ink); }
  .bar div:first-child { border-left: 0; }
  .bar small { display: block; font-family: "Martian Mono", monospace; font-size: 12px; color: var(--ink-2); text-transform: uppercase; }
  .bar b { display: block; margin-top: 4px; font-size: 21px; font-weight: 700; }
</style>
</head>
